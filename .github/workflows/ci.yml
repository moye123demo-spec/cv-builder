name: Validate CV Builder

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt
      - run: python skill/scripts/validate_profile.py evals/fixtures/minimal_candidate.json
      - run: python skill/scripts/run_evals.py
